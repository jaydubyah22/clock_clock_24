[project]
name = "clock-clock-24"
version = "0.2.0"
description = "A Tkinter clock built from 24 synchronized analog clock faces"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
clock-clock-24 = "main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "app", "animation", "model", "data", "settings"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
